name: Trimite Notificari

on:
  schedule:
    - cron: '0 7 * * *' # Rulează zilnic la ora 07:00 UTC
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mod de test (true/false)'
        required: false
        default: 'false'
        type: string
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descarcă fișierele
        uses: actions/checkout@v4

      - name: Pregătește serverul
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalează modulele
        run: npm install

      - name: Rulează scriptul de notificări (Cautare Automata)
        env:
          MY_TELEGRAM_TOKEN: ${{ secrets.MY_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_TEST: ${{ github.event_name == 'push' || github.event.inputs.test_mode == 'true' }}
        run: |
          SCRIPT_PATH=$(find . -name "send-notification*" | head -n 1)
          echo "Fișier găsit exact la calea: $SCRIPT_PATH"
          node "$SCRIPT_PATH"
