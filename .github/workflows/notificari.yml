name: Trimite Notificari

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Bifează pentru trimitere de TEST (ignoră ora)'
        type: boolean
        required: true
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descarcă fișierele
        uses: actions/checkout@v4

      - name: Pregătește serverul
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalează modulele
        run: npm install

      - name: Rulează scriptul de notificări (Cautare Automata)
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBSCRIPTION: ${{ secrets.WEB_PUSH_SUBSCRIPTION }}
          IS_TEST: ${{ github.event_name == 'push' || github.event.inputs.test_mode == 'true' }}
        run: |
          SCRIPT_PATH=$(find . -name "send-notification*" | head -n 1)
          echo "Fișier găsit exact la calea: $SCRIPT_PATH"
          node "$SCRIPT_PATH"

      - name: Salvează istoricul citatelor
        if: ${{ github.event_name != 'push' && github.event.inputs.test_mode != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update istoric citate [skip ci]" && git push)
