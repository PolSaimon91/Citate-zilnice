name: Trimite Notificari

on:
  schedule:
    # Ruleaza la 07:00, 10:00, 13:00, 16:00 si 19:00 UTC
    # Adica exact la 09:00, 12:00, 15:00, 18:00 si 21:00 (ora Romaniei)
    - cron: '0 7,10,13,16,19 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă fișierele
        uses: actions/checkout@v4

      - name: Pregătește serverul
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalează modulele
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Rulează scriptul de notificări (Cautare Automata)
        env:
          MY_TELEGRAM_TOKEN: ${{ secrets.MY_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SCRIPT_PATH=$(find . -name "send-notification*" | head -n 1)
          echo "Fișier găsit exact la calea: $SCRIPT_PATH"
          node "$SCRIPT_PATH"
