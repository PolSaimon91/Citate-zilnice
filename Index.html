<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Citate</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Citate">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/FFFFFF?text=C">
  <style>
    body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 20px; text-align: center; padding-top: 50px; }
    .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #007aff; color: white; border: none; padding: 15px 20px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
    textarea { width: 100%; padding: 10px; margin-top: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Citate Zilnice</h2>
  
  <div class="card">
    <p id="statusText">Se verifică starea...</p>
    <div id="setupSection" style="display: none;">
      <button id="btnEnable">Activează Notificările</button>
    </div>
  </div>

  <div class="card" id="subSection" style="display: none;">
    <p><b>Pasul final:</b> Copiază codul de mai jos pentru a-l pune în GitHub Secrets.</p>
    <textarea id="subData" rows="6" readonly onclick="this.select()"></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
